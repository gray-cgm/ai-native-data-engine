[project]
name = "dlkit"
version = "0.1.0"
description = "Data Loop Kit — minimal SDK for algorithm engineers consuming AI Native Data Engine exports."
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlkit"]
