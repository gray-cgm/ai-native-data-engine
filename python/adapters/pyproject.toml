[project]
name = "ad-adapters"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "ad-core",
  "duckdb>=1.0.0",
  "pyarrow>=17.0.0",
  "pylance>=4.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adapters"]
