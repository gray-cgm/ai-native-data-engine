profile: team-dev

# Layer mapping:
# storage = storage layer
# query = query layer
# compute = compute layer
# search = file-format-backed retrieval capability
# metadata = 元数据与事务控制层
# auth = cross-cutting access control capability

storage:
  provider: opendal
  scheme: s3
  root: ./data            # base：本地形 uri（如 export_output_uri）归一为 bucket 内 key
  bucket: ad-data
  endpoint: http://minio:9000
  region: us-east-1
  access_key_id: minioadmin
  secret_access_key: minioadmin

file_formats:
  current_primary: lance
  target_primary: lance
  retrieval_format: lance
  export_default: lance

query:
  provider: duckdb
  database: ./data/duckdb/team.duckdb

compute:
  provider: dagster_local

metadata:
  provider: postgres
  dsn: postgresql://postgres:postgres@postgres:5432/ad_closure

search:
  provider: lance
  uri: ./data/lance/team_samples.lance

auth:
  provider: local
  jwt_secret: team-dev-secret

capabilities:
  multi_tenant: false
  sso: false
  distributed_compute: false
  advanced_governance: false
  object_storage: true
