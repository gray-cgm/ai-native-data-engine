[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.6",
  "python-dotenv>=1.0.1",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "oss2>=2.19.1",
  "ad-core",
  "ad-adapters",
  "ad-workflows",
  "ad-profiles",
  "ad-services"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
