# Alembic configuration for ai-data-loop-engine API metadata DB.
#
# Usage examples:
#     make db-upgrade                         # migrate to head
#     make db-revision MSG="add foo column"   # autogenerate new revision
#     make db-downgrade REV=-1                # rollback one step

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# DB URL is loaded dynamically from env.py to respect DATABASE_URL env var.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
